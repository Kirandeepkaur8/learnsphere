<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Manage Course')}"></head>

<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments :: navigation}"></nav>

<main class="container flex-grow-1 py-5">

    <div class="form-card mx-auto">

        <h1 class="fw-bold"
            th:text="${editMode
                ? 'Edit Course'
                : 'Add a New Course'}">
            Add a New Course
        </h1>

        <p class="text-secondary">
            Complete all required fields before saving.
        </p>

        <form method="post"
              th:action="${editMode}
                ? @{/courses/{id}/edit(id=${course.id})}
                : @{/courses}"
              th:object="${course}"
              novalidate>

            <div class="alert alert-danger"
                 th:if="${#fields.hasAnyErrors()}">
                Please correct the errors shown below.
            </div>

            <div class="row g-3">

                <div class="col-md-4">
                    <label for="courseCode"
                           class="form-label">
                        Course Code
                    </label>

                    <input id="courseCode"
                           type="text"
                           class="form-control"
                           th:field="*{courseCode}"
                           placeholder="WEB-101"
                           th:classappend="${#fields.hasErrors('courseCode')}
                                ? ' is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{courseCode}">
                    </div>
                </div>

                <div class="col-md-8">
                    <label for="title"
                           class="form-label">
                        Course Title
                    </label>

                    <input id="title"
                           type="text"
                           class="form-control"
                           th:field="*{title}"
                           th:classappend="${#fields.hasErrors('title')}
                                ? ' is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{title}">
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="instructorName"
                           class="form-label">
                        Instructor Name
                    </label>

                    <input id="instructorName"
                           type="text"
                           class="form-control"
                           th:field="*{instructorName}"
                           th:classappend="${#fields.hasErrors('instructorName')}
                                ? ' is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{instructorName}">
                    </div>
                </div>

                <div class="col-md-3">
                    <label for="category"
                           class="form-label">
                        Category
                    </label>

                    <select id="category"
                            class="form-select"
                            th:field="*{category}"
                            th:classappend="${#fields.hasErrors('category')}
                                ? ' is-invalid'">

                        <option value="">
                            Choose...
                        </option>

                        <option
                                th:each="item : ${categories}"
                                th:value="${item}"
                                th:text="${item.displayName}">
                        </option>
                    </select>

                    <div class="invalid-feedback"
                         th:errors="*{category}">
                    </div>
                </div>

                <div class="col-md-3">
                    <label for="difficulty"
                           class="form-label">
                        Difficulty
                    </label>

                    <select id="difficulty"
                            class="form-select"
                            th:field="*{difficulty}"
                            th:classappend="${#fields.hasErrors('difficulty')}
                                ? ' is-invalid'">

                        <option value="">
                            Choose...
                        </option>

                        <option
                                th:each="item : ${difficultyLevels}"
                                th:value="${item}"
                                th:text="${item.displayName}">
                        </option>
                    </select>

                    <div class="invalid-feedback"
                         th:errors="*{difficulty}">
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="durationWeeks"
                           class="form-label">
                        Duration in Weeks
                    </label>

                    <input id="durationWeeks"
                           type="number"
                           min="1"
                           max="52"
                           class="form-control"
                           th:field="*{durationWeeks}"
                           th:classappend="${#fields.hasErrors('durationWeeks')}
                                ? ' is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{durationWeeks}">
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="price"
                           class="form-label">
                        Price
                    </label>

                    <input id="price"
                           type="number"
                           min="0"
                           max="9999.99"
                           step="0.01"
                           class="form-control"
                           th:field="*{price}"
                           th:classappend="${#fields.hasErrors('price')}
                                ? ' is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{price}">
                    </div>
                </div>

                <div class="col-12">
                    <label for="description"
                           class="form-label">
                        Description
                    </label>

                    <textarea id="description"
                              rows="5"
                              class="form-control"
                              th:field="*{description}"
                              th:classappend="${#fields.hasErrors('description')}
                                ? ' is-invalid'">
                    </textarea>

                    <div class="invalid-feedback"
                         th:errors="*{description}">
                    </div>
                </div>
            </div>

            <div class="mt-4">

                <button type="submit"
                        class="btn btn-primary"
                        th:text="${editMode
                            ? 'Save Changes'
                            : 'Save Course'}">
                    Save Course
                </button>

                <a class="btn btn-outline-secondary"
                   th:href="${editMode}
                        ? @{/admin}
                        : @{/courses}">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
