<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(pageTitle)">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${pageTitle + ' | LearnSphere'}">
        LearnSphere
    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

</head>

<body>

<!-- Shared navigation -->
<nav th:fragment="navigation"
     class="navbar navbar-dark learnsphere-navbar shadow-sm">

    <div class="container-fluid px-4 px-lg-5 py-2
                d-flex flex-wrap
                align-items-center
                gap-3 navbar-content">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            LearnSphere
        </a>

        <div class="d-flex flex-wrap
                    align-items-center
                    justify-content-end
                    gap-2 nav-actions">

            <a class="btn btn-sm btn-outline-light"
               th:href="@{/}">
                Home
            </a>

            <a class="btn btn-sm btn-outline-light"
               th:href="@{/courses}">
                Courses
            </a>

            <a class="btn btn-sm btn-outline-light"
               th:href="@{/about}">
                About
            </a>

            <a class="btn btn-sm btn-outline-light"
               th:href="@{/how-it-works}">
                How It Works
            </a>

            <!-- Instructor and Administrator -->
            <a class="btn btn-sm btn-warning"
               sec:authorize="hasAnyAuthority('ROLE_INSTRUCTOR','ROLE_ADMIN')"
               th:href="@{/courses/new}">
                Add Course
            </a>

            <!-- Administrator only -->
            <a class="btn btn-sm btn-dark"
               sec:authorize="hasAuthority('ROLE_ADMIN')"
               th:href="@{/admin}">
                Admin
            </a>

            <!-- Logged-out navigation -->
            <div sec:authorize="isAnonymous()"
                 class="d-flex flex-wrap gap-2">

                <a class="btn btn-sm btn-outline-light"
                   th:href="@{/login}">
                    Login
                </a>

                <a class="btn btn-sm btn-warning"
                   th:href="@{/register}">
                    Register
                </a>

            </div>

            <!-- Logged-in navigation -->
            <div sec:authorize="isAuthenticated()"
                 class="d-flex flex-wrap
                        align-items-center gap-2
                        authenticated-actions">

                <span class="text-white small user-email"
                      th:title="${#authentication.name}">

                    Signed in as

                    <strong sec:authentication="name">
                        user@example.com
                    </strong>

                </span>

                <a class="btn btn-sm btn-outline-light"
                   th:href="@{/dashboard}">
                    Dashboard
                </a>

                <form th:action="@{/logout}"
                      method="post"
                      class="m-0">

                    <button type="submit"
                            class="btn btn-sm btn-warning">
                        Logout
                    </button>

                </form>

            </div>

        </div>
    </div>
</nav>

<!-- Shared footer -->
<footer th:fragment="footer"
        class="site-footer mt-auto">

    <div class="container py-4 text-center">

        <p>
            LearnSphere · CPAN-228 · Security &amp; User Management
        </p>

    </div>
</footer>

</body>
</html>
