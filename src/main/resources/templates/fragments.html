<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle + ' | LearnSphere'}">LearnSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav th:fragment="navigation"
     class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container py-2 d-flex flex-wrap gap-3">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            LearnSphere
        </a>

        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-sm btn-outline-light" th:href="@{/}">
                Home
            </a>

            <a class="btn btn-sm btn-outline-light" th:href="@{/courses}">
                Courses
            </a>

            <a class="btn btn-sm btn-outline-light" th:href="@{/about}">
                About
            </a>

            <a class="btn btn-sm btn-outline-light"
               th:href="@{/how-it-works}">
                How It Works
            </a>

            <a class="btn btn-sm btn-warning" th:href="@{/courses/new}">
                Add Course
            </a>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-dark text-white mt-auto">
    <div class="container py-4 text-center">
        LearnSphere · CPAN-228 · Kirandeep Kaur
    </div>
</footer>

</body>
</html>
